name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coding-standards:
    name: WordPress coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: cs2pr
      - uses: ramsey/composer-install@v3
      # cs2pr turns the report into inline annotations, so a violation is read
      # where it lives rather than in a log nobody opens.
      - run: composer exec -- phpcs -q --report=checkstyle | cs2pr

  unit:
    name: Unit tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is what the plugin header promises; the rest is what people
        # actually run. A promise nobody tests is a guess.
        php: [ '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer exec -- phpunit

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      # Check what actually ships, not what is in the repository.
      #
      # Pointed at the root, the action flagged phpunit.xml.dist, .github/ and
      # .claude/ -- none of which the ZIP carries. It was measuring the wrong
      # tree, and a check that reports on files nobody will ever install trains
      # whoever reads it to skim past the ones that matter.
      - name: Build the tree that would be published
        run: |
          mkdir -p build/${{ github.event.repository.name }}
          rsync -a --exclude-from=.distignore --exclude='/build' ./ build/${{ github.event.repository.name }}/

      - uses: WordPress/plugin-check-action@v1
        with:
          build-dir: './build/${{ github.event.repository.name }}'
          # The vendored Datastar SDK is third-party code, kept verbatim apart
          # from its namespace and pinned by checksum in the unit tests. Its
          # three findings are recorded, with the reason each one stands, in
          # includes/datastar-php/UPSTREAM.md. Excluding it here keeps this job
          # about OUR regressions; the reviewer still sees them on submission,
          # which is where that conversation belongs.
          exclude-directories: 'datastar-php'
